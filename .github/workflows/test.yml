name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth-service, catalogue-service, collection-service, frontend, gamification-service, gateway]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: npm ci

      - name: Run tests
        working-directory: ${{ matrix.service }}
        run: npm test

  ai-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-service/requirements-dev.txt

      # ultralytics pulls in opencv-python (not the -headless variant), which
      # dlopens libGL.so.1 at import time — present on a desktop OS but not
      # guaranteed on a bare Linux CI image. Without this, `import ultralytics`
      # (via src/routes.py -> src/model_loader.py) fails instantly.
      - name: Install OpenCV's native dependencies
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install dependencies
        working-directory: ai-service
        run: pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: ai-service
        run: python -m pytest tests/ -v

  smoke-test:
    name: End-to-end smoke test
    runs-on: ubuntu-latest
    needs: [test, ai-service]
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: thesis
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # A throwaway pair, valid only for this job's lifetime — not a real
      # deployment secret. Every service that verifies internal traffic
      # (INTERNAL_SERVICE_SECRET) or user tokens (JWT_SECRET) needs the same
      # value, matching how the real gateway/services are configured.
      JWT_SECRET: ci-smoke-test-jwt-secret
      INTERNAL_SERVICE_SECRET: ci-smoke-test-internal-secret
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/thesis
      # The gateway's own code defaults to Docker-style hostnames
      # (http://auth-service:3001) since it was written with Docker Compose
      # in mind; this project runs Docker-free, so every environment
      # (this CI job included) must override them to real reachable URLs.
      AUTH_SERVICE_URL: http://localhost:3001
      CATALOGUE_SERVICE_URL: http://localhost:3002
      COLLECTION_SERVICE_URL: http://localhost:3003
      GAMIFICATION_SERVICE_URL: http://localhost:3004
      AI_SERVICE_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt

      # See the same step in the ai-service job above: ultralytics pulls in
      # opencv-python, which needs libGL.so.1 at import time.
      - name: Install OpenCV's native dependencies
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0

      # CLIP (openai/clip-vit-large-patch14, ~1.7GB) and the plate/face
      # censoring models are downloaded from HuggingFace Hub on first use;
      # yolov8n.pt is downloaded by ultralytics into ai-service/ itself.
      # Caching both means only the first run (or a cache eviction) pays for
      # the download — every other run reuses it.
      - name: Cache downloaded model weights
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ai-service/yolov8n.pt
          key: ai-model-weights-v1

      - name: Install Node dependencies
        run: |
          for svc in gateway auth-service catalogue-service collection-service gamification-service; do
            npm ci --prefix "$svc"
          done

      - name: Install ai-service dependencies
        working-directory: ai-service
        run: pip install -r requirements.txt

      # Downloads CLIP + YOLO explicitly, with its own timeout and visible
      # output, instead of letting it happen silently inside the backgrounded
      # `uvicorn` process below — a download failure or a slow cold cache
      # (first run of the "Cache downloaded model weights" key above) would
      # otherwise just look like ai-service "never became healthy", with the
      # real cause buried in a log file this step makes unnecessary to read.
      - name: Pre-download CLIP/YOLO model weights
        working-directory: ai-service
        timeout-minutes: 10
        run: |
          python -c "
          from transformers import CLIPModel, CLIPProcessor
          CLIPProcessor.from_pretrained('openai/clip-vit-large-patch14')
          CLIPModel.from_pretrained('openai/clip-vit-large-patch14')
          from ultralytics import YOLO
          YOLO('yolov8n.pt')
          print('Model weights ready.')
          "

      - name: Start services and run smoke test
        run: |
          set -uo pipefail
          mkdir -p ci-logs

          wait_for() {
            local url="$1" name="$2"
            for _ in $(seq 1 60); do
              if curl -sf "$url" > /dev/null 2>&1; then
                echo "$name is up"
                return 0
              fi
              sleep 5
            done
            echo "$name did not become healthy in time"
            return 1
          }

          # Start every upstream service first; the gateway proxies to all of
          # them, so it goes last and its own health check implicitly proves
          # the whole chain is reachable.
          (cd auth-service && nohup node src/index.js > "$GITHUB_WORKSPACE/ci-logs/auth-service.log" 2>&1 &)
          (cd catalogue-service && nohup node src/index.js > "$GITHUB_WORKSPACE/ci-logs/catalogue-service.log" 2>&1 &)
          (cd collection-service && nohup node src/index.js > "$GITHUB_WORKSPACE/ci-logs/collection-service.log" 2>&1 &)
          (cd gamification-service && nohup node src/index.js > "$GITHUB_WORKSPACE/ci-logs/gamification-service.log" 2>&1 &)
          (cd ai-service && nohup python -m uvicorn src.main:app --host 127.0.0.1 --port 8000 > "$GITHUB_WORKSPACE/ci-logs/ai-service.log" 2>&1 &)

          READY=0
          wait_for "http://localhost:3001/health" "auth-service" || READY=1
          wait_for "http://localhost:3002/health" "catalogue-service" || READY=1
          wait_for "http://localhost:3003/health" "collection-service" || READY=1
          wait_for "http://localhost:3004/health" "gamification-service" || READY=1
          wait_for "http://localhost:8000/health" "ai-service" || READY=1

          if [ "$READY" -ne 0 ]; then
            echo "One or more upstream services failed to start; dumping logs."
            tail -n 200 ci-logs/*.log
            exit 1
          fi

          (cd gateway && nohup node src/index.js > "$GITHUB_WORKSPACE/ci-logs/gateway.log" 2>&1 &)
          wait_for "http://localhost:8080/health" "gateway" || READY=1

          if [ "$READY" -ne 0 ]; then
            echo "Gateway failed to start; dumping its log."
            tail -n 200 ci-logs/gateway.log
            exit 1
          fi

          pwsh scripts/smoke-test.ps1
          SMOKE_EXIT=$?

          if [ "$SMOKE_EXIT" -ne 0 ]; then
            echo "Smoke test failed; dumping every service log."
            for f in ci-logs/*.log; do
              echo "----- $f -----"
              tail -n 200 "$f"
            done
          fi

          exit $SMOKE_EXIT

      - name: Upload service logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-logs
          path: ci-logs/*.log
          retention-days: 5
